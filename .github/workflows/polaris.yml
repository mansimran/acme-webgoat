name: Polaris
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  polaris:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Polaris scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          polaris_server_url: ${{ secrets.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_application_name: "Singh Interview"
          polaris_project_name: "acme-webgoat"
          polaris_assessment_types: "SAST,SCA"
          polaris_prComment_enabled: ${{ github.event_name == 'pull_request' }}
          polaris_prComment_severities: "CRITICAL,HIGH"
          polaris_reports_sarif_create: true
          polaris_reports_sarif_severities: "CRITICAL,HIGH"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate on Critical/High findings
        if: github.event_name == 'pull_request'
        run: |
          f=.blackduck/integrations/polaris/sarif/report.sarif.json
          ls -la "$f"
          n=$(jq '[.runs[].results[]] | length' "$f")
          echo "Critical/High findings in report: $n"
          if [ "$n" -gt 0 ]; then
            echo "Blocking merge: new Critical/High findings"
            exit 1
          fi
